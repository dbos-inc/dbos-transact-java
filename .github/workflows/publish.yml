name: Publish

on:
  workflow_call:
   secrets:
    MAVEN_CENTRAL_USERNAME:
      required: true
    MAVEN_CENTRAL_PASSWORD:
      required: true
    SIGNING_KEY:
      required: true
    SIGNING_KEY_PASSWORD:
      required: true
  workflow_dispatch:

# Each destination is its own job, so "Re-run failed jobs" retries only the publish that failed.
# Neither registry accepts a version twice, so rerunning one that succeeded fails.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
      is_tagged: ${{ steps.get_version.outputs.is_tagged }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch-depth 0 needed for version calculation

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew assemble

      - name: Get Gradle project version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          TAGS=$(git tag --points-at HEAD)

          echo "Project version: $VERSION, tags: $TAGS"

          if [ -z "$TAGS" ]; then
            echo "is_tagged=false" >> $GITHUB_OUTPUT
          else
            echo "is_tagged=true" >> $GITHUB_OUTPUT
          fi

          # A final release is bare semver (X.Y.Z); any suffix (-rc, -m, -a) is a prerelease.
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: transact*/build/libs/*.jar

  # Every main and release/* build goes to GitHub Packages
  publish-github-packages:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      packages: write
    env:
      # Publish the version the build job computed, not one recomputed from tags added since.
      DBOS_VERSION_OVERRIDE: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

  # Only full releases go to Maven Central
  publish-maven-central:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') && needs.build.outputs.prerelease == 'false'
    env:
      # Publish the version the build job computed, not one recomputed from tags added since.
      DBOS_VERSION_OVERRIDE: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # A GitHub Release for each full release, once it is on Maven Central
  release:
    needs: [build, publish-maven-central]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') && needs.build.outputs.is_tagged == 'true'
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v7
        with:
          name: jars
          path: jars

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find jars -name '*.jar' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Github Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: |
            release-assets/*
