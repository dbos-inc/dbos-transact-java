name: Publish

on:
  workflow_call:
   secrets:
    MAVEN_CENTRAL_USERNAME:
      required: true
    MAVEN_CENTRAL_PASSWORD:
      required: true
    SIGNING_KEY:
      required: true
    SIGNING_KEY_PASSWORD:
      required: true
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch-depth 0 needed for version calculation

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew assemble

      # only publish main & release/* builds to maven central
      - name: Publish to Maven Central
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: transact*/build/libs/*.jar

  release:
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch-depth 0 needed for version calculation

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get Gradle project version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')
          TAGS=$(git tag --points-at HEAD)

          echo "Project version: $VERSION, tags: $TAGS"

          if [ -z "$TAGS" ]; then
            echo "is_tagged=false" >> $GITHUB_OUTPUT
          else
            echo "is_tagged=true" >> $GITHUB_OUTPUT
          fi

          # A final release is bare semver (X.Y.Z); any suffix (-rc, -m, -a) is a prerelease.
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download jars
        uses: actions/download-artifact@v7
        with:
          name: jars
          path: jars

      - name: Stage release assets
        id: stage
        run: |
          mkdir -p release-assets
          find jars -name '*.jar' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Github Release
        if: steps.get_version.outputs.is_tagged == 'true'
        uses: softprops/action-gh-release@v2.1.0
        with:
          name: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.get_version.outputs.prerelease }}
          files: |
            release-assets/*
